; SIGAV v2 — límites de subida de archivos (se copia a /usr/local/etc/php/conf.d/ en el Dockerfile).
; Sin esto rigen los defaults de PHP (2M por archivo, 8M por POST): una foto de celular
; (3-6 MB) se descartaba en silencio y dos o más daban "413 Content Too Large".
; El alta de producto acepta hasta 6 imágenes de 10 MB (validación en ProductoController@store);
; upload_max_filesize queda un poco por encima para que el error lo dé Laravel con mensaje claro.
upload_max_filesize = 12M
post_max_size = 80M
max_file_uploads = 20
; Intervention/GD necesita ~50 MB por bitmap de una foto de 12 MP; con el default de 128M se corta.
memory_limit = 256M
