# Configuración de Nginx para SIGAV (Laravel 7)
# El marcador __DOMAIN__ se reemplaza automáticamente por setup-server.sh.
# El web root de Laravel es siempre la carpeta /public.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /var/www/sigav/public;
    index index.php index.html;

    charset utf-8;

    # Tamaño máximo de subida (facturas, comprobantes, imágenes).
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Bloquear acceso a archivos ocultos (excepto .well-known para Certbot).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/sigav-access.log;
    error_log  /var/log/nginx/sigav-error.log;
}
