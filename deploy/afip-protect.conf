# Bloquea el acceso web a las claves/certs de AFIP (siguen accesibles para PHP en disco).
<DirectoryMatch "^/var/www/html/public/AFIP/(key|cert)">
    Require all denied
</DirectoryMatch>

# Sin listado de directorios en el docroot.
<Directory /var/www/html/public>
    Options -Indexes
</Directory>

# Expone las variables de entorno del contenedor a mod_php (getenv() en el
# código legacy, ej. public/conection.php). Sin esto, getenv() bajo Apache
# devuelve vacío y la conexión MySQL legacy cae al default "localhost".
PassEnv LEGACY_DB_HOST LEGACY_DB_USER LEGACY_DB_PASS LEGACY_DB_NAME LEGACY_SEMILLA API_SECRET_KEY
PassEnv MAIL_HOST MAIL_PORT MAIL_USERNAME MAIL_PASSWORD MAIL_ENCRYPTION MAIL_FROM_ADDRESS MAIL_FROM_NAME
PassEnv SMARTSUPP_KEY
