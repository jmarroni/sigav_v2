# SIGAV v2 — instancia de Mercado Artesanal en la misma VM que Acantilado Sur.
#
# Un solo servicio: la app (misma imagen `sigav-app:prod` que Acantilado).
# La base de datos vive en el MySQL de Acantilado (`sigav_db`) como base
# separada `mercado`, con su propio usuario (decisión del operator, 2026-09-14:
# la VM e2-small no tiene RAM para un segundo MySQL). Backups: deploy/backup.sh
# ya recorre `sigav_db`; hay que agregar la base `mercado` al dump.
#
# Caddy es el de Acantilado (sigav_caddy) y llega a esta app por la red
# externa `sigav_sigav`, igual que sattor/gimnasio/cementos. El bloque de
# Caddy está en deploy/Caddyfile (hosts sistema.mercado-artesanal.com.ar y
# mercado-artesanal.sigav.ar).
#
# Uso en la VM (desde /opt/mercado):
#   sudo docker compose -f deploy/mercado/docker-compose.mercado.yml --env-file .env up -d
services:
  mercado_app:
    image: sigav-app:prod
    container_name: mercado_app
    restart: always
    expose:
      - "80"
    volumes:
      - ../../:/var/www/html
      - ../afip-protect.conf:/etc/apache2/conf-enabled/zz-afip-protect.conf:ro
    # Todo el .env de Laravel entra al contenedor tal cual (sin interpolación de
    # Compose: un valor con `$` como la semilla se truncaría con `${VAR}`). Bajo
    # Apache/mod_php solo llegan a getenv() las variables listadas en PassEnv
    # (deploy/afip-protect.conf); Laravel web lee el mismo .env por Dotenv. Una
    # sola fuente de verdad: /opt/mercado/.env.
    env_file:
      - ../../.env
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public
      CATALOGO_IMPORTAR_PERMITIDO: "false"
    # La VM (e2-small, 2 GB) ya tuvo OOM: se acota este contenedor para que un
    # pico no mate al MySQL compartido con Acantilado.
    mem_limit: 384m
    memswap_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [caddy_shared]

networks:
  # Red del stack de Acantilado, donde viven sigav_caddy y sigav_db.
  caddy_shared:
    external: true
    name: ${CADDY_NETWORK:-sigav_sigav}
